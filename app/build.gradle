plugins { id 'com.android.application' }

dependencies { implementation files('libs/fitz-1.28.5.aar') }

android {
    namespace 'app.quietread'
    compileSdk 35
    defaultConfig {
        applicationId 'app.quietread'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.2.2'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    flavorDimensions += 'architecture'
    productFlavors {
        arm64 { dimension 'architecture'; ndk { abiFilters 'arm64-v8a' } }
        emulator { dimension 'architecture'; ndk { abiFilters 'x86_64' } }
    }
    buildTypes {
        release { minifyEnabled false }
        debug { }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets {
        arm64 { jniLibs.srcDir 'src/arm64/bridgeLibs' }
        emulator { jniLibs.srcDir 'src/emulator/bridgeLibs' }
    }
    // LibreOffice's virtual filesystem maps APK assets directly. They MUST remain uncompressed.
    // Keep every engine asset uncompressed without disabling compression for the large .so files.
    androidResources { noCompress += fileTree('src/main/assets').files.collect { it.name }.unique() }
    lint { abortOnError true; disable 'OldTargetApi' }
}
